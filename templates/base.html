<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090c">
  <meta name="description" content="NVIDIA Support — tickets, bot documentation, and community support for Discord.">
  <title>{% block title %}NVIDIA Support{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark"><span>N</span></span>
      <span>NVIDIA <b>SUPPORT</b></span>
    </a>
    <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <nav class="nav-links">
      <a class="{{ 'active' if page == 'home' else '' }}" href="/">Home</a>
      <a class="{{ 'active' if page == 'commands' else '' }}" href="/commands">Commands</a>
      <a class="{{ 'active' if page == 'about' else '' }}" href="/about">About</a>
      <a class="{{ 'active' if page == 'support' else '' }}" href="/support">Support</a>
    </nav>
    <a class="nav-cta" href="/support">Get help <span>↗</span></a>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <footer class="footer">
    <div class="footer-main">
      <a class="brand" href="/"><span class="brand-mark"><span>N</span></span><span>NVIDIA <b>SUPPORT</b></span></a>
      <p>Support that keeps your community moving.</p>
    </div>
    <div class="footer-links">
      <a href="/commands">Commands</a><a href="/about">About</a><a href="/support">Support</a>
      <a href="/privacy">Privacy</a><a href="/terms">Terms</a>
    </div>
    <div class="footer-bottom"><span>© <span id="year"></span> NVIDIA Support Community</span><span>Independent community project · Not affiliated with NVIDIA Corporation</span></div>
  </footer>
  <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
